services:
  web:
    platform: linux/amd64
    container_name: web
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-frontend:${TAG:-latest}
    restart: always
    depends_on:
      - api

  admin:
    platform: linux/amd64
    container_name: admin
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-admin:${TAG:-latest}
    restart: always
    depends_on:
      - api
      - web

  space:
    platform: linux/amd64
    container_name: space
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-space:${TAG:-latest}
    restart: always
    depends_on:
      - api
      - web

  api:
    platform: linux/amd64
    container_name: api
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-backend:${TAG:-latest}
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  worker:
    platform: linux/amd64
    container_name: bgworker
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-backend:${TAG:-latest}
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    platform: linux/amd64
    container_name: beatworker
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-backend:${TAG:-latest}
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    platform: linux/amd64
    container_name: plane-migrator
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-backend:${TAG:-latest}
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  live:
    platform: linux/amd64
    container_name: plane-live
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-live:${TAG:-latest}
    restart: always
    environment:
      PORT: 3000
      API_BASE_URL: "http://api:8000"
      WEB_BASE_URL: "http://web:3000"
      LIVE_BASE_URL: "http://live:3000"
      LIVE_BASE_PATH: "/live"
      LIVE_SERVER_SECRET_KEY: "secret-key"
      REDIS_URL: "redis://plane-redis:6379/"

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  proxy:
    platform: linux/amd64
    container_name: proxy
    image: ${IMAGE_PREFIX:-ghcr.io/OWNER}/plane-proxy:${TAG:-latest}
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT:-80}:80
      - ${LISTEN_HTTPS_PORT:-443}:443
    env_file:
      - .env
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
