name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: true
        default: "latest"
        type: string
      push_to_dockerhub:
        description: "Push to Docker Hub in addition to GHCR (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - preview
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
            image: plane-backend
          - name: frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
            image: plane-frontend
          - name: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
            image: plane-admin
          - name: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
            image: plane-space
          - name: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
            image: plane-live
          - name: proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
            image: plane-proxy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: ${{ (inputs.push_to_dockerhub == true) && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Tags
        id: tags
        run: |
          # Lowercase repository owner for valid image naming
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${OWNER}/${{ matrix.service.image }}"

          CUSTOM_TAG="${{ inputs.tag || 'latest' }}"
          TAGS="${GHCR_IMAGE}:${CUSTOM_TAG},${GHCR_IMAGE}:${{ github.sha }}"

          # If pushing to Docker Hub as well
          if [ "${{ inputs.push_to_dockerhub }}" == "true" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            DH_OWNER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
            DH_IMAGE="${DH_OWNER}/${{ matrix.service.image }}"
            TAGS="${TAGS},${DH_IMAGE}:${CUSTOM_TAG},${DH_IMAGE}:${{ github.sha }}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
